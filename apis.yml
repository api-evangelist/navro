name: Navro
description: 'Navro (formerly Paytrix) is a London-based payments curation platform that lets large
  businesses move money globally through a single contract and API integration. Rather than stitching
  together a patchwork of banks and payment providers, Navro routes each payment via the right rail,
  currency and compliance model, executing millions of payouts across 140+ currencies and 200+ regions.
  Its products span Navro Workforce (global payroll, contractor and pension payouts), Navro Life
  (cross-border pensions), Navro Digital (payments for digital platforms and enterprises) and Navro
  Capital (international fund flows). Clients integrate once via the Navro API or use the no-code Navro
  Hub portal for real-time payment visibility and reporting. Founded by Aran Brown (CEO) and Eddie
  Harrison, Navro operates from London with offices in Ireland and the United States, and is authorised
  by the UK Financial Conduct Authority, the Central Bank of Ireland and FinCEN in the US.'
